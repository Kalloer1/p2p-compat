plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // P2P core 1.1.0 (flatDir libs/p2p-1.1.0.jar)
    implementation "blank:p2p:1.1.0"
    // Host mods (all optional at runtime; guarded by ModList.isLoaded in P2PCompat)
    implementation files('libs/Create-6.0.11.jar')
    implementation files('libs/Mekanism-1.21.1-10.7.19.85.jar')
    implementation files('libs/appliedenergistics2-19.2.17.jar')
    implementation files('libs/ars_nouveau-1.21.1-5.13.1.jar')
    // Create compileOnly deps (same coordinates as the old p2pcreate project)
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.85+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // JEI: was a hardcoded absolute gradle-cache path in p2pmekanism; now a local jar
    compileOnly files('libs/jei-1.21.1-neoforge-19.21.0.247.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

idea { module { downloadSources = true; downloadJavadoc = true } }

tasks.test { useJUnitPlatform() }
