plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Create 应力模块的 mixin 支持（refmap 生成 + 依赖配置）
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Official Mojang field/method names.
    mappings channel: mapping_channel, version: mapping_version

    // Required for userdev to function in IDE environments.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin：refmap 名与 p2pcreate.mixins.json 里的 "refmap" 键一致。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config 'p2pcreate.mixins.json'
}

// MixinGradle 0.7.x + ForgeGradle 6 不会自动注入 Mixin 注解处理器，需手动声明
// （processor classifier 在 spongepowered 仓库）。
configurations {
    annotationProcessor
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

repositories {
    flatDir { dirs 'libs' }
    // JEI 15.x API maven
    maven { url = 'https://maven.blamejared.com' }
    // Create 6.0.x 编译期传递库（ponder：KineticBlockEntity 的 SmartBlockEntity 层级实现了
    // net.createmod.ponder.api.VirtualBlockEntity，javac 解析层级需要它；catnip 由其 pom 传递）
    maven { url = 'https://maven.createmod.net' }
    // Mixin 注解处理器（0.8.5:processor classifier 不在 Maven Central）
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // P2P core 1.4.0 (Filter.addonData + ChannelScreenExtensions/FilterPageExtensions dispatch points)
    implementation fg.deobf("blank:p2p:1.20.1-1.4.0")

    // Host mods (all optional at runtime; guarded by ModList.isLoaded in P2PCompat)
    implementation fg.deobf("blank:ars_nouveau:1.20.1-4.12.7")
    implementation fg.deobf("blank:botania:1.20.1-455")
    implementation fg.deobf("blank:mekanism:1.20.1-10.4.16.80")
    implementation fg.deobf("blank:ae2:15.4.10")
    implementation fg.deobf("blank:create:1.20.1-6.0.8")

    // Create 编译期传递依赖（仅编译；运行时由 Create 自带的依赖提供）
    compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.92")

    // JEI API (compile-only; ghost ingredient drag in the filter editor). Runtime provided by the player's JEI install.
    compileOnly fg.deobf("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${jei_minecraft_version}-forge-api:${jei_version}")

    // EMI API (compile-only; drag-drop into the filter editor marker grid). Runtime provided by the player's EMI install.
    compileOnly fg.deobf("blank:emi:${emi_version}")
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Configure the jar (with ForgeGradle the jar task is finalized by reobfJar).
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Forge (FML 47) 读取该 MANIFEST 条目并注入 Create 宿主类的 mixin 配置
                'MixinConfigs'           : 'p2pcreate.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
